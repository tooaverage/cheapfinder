<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         width: 260px; margin: 0; padding: 14px; background: #1a1c22; color: #e8eaed; font-size: 13px; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  h1 span { color: #5b8cff; }
  label { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  button { background: #2a2d38; color: #e8eaed; border: 1px solid #34384a; border-radius: 7px;
           padding: 5px 10px; cursor: pointer; font-size: 12px; }
  button:hover { border-color: #5b8cff; }
  .muted { color: #9aa0a6; font-size: 11.5px; line-height: 1.4; margin-top: 10px; }
  #host { font-weight: 600; }
</style>
</head>
<body>
  <h1>Cheap<span>Finder</span></h1>
  <label><input type="checkbox" id="enabled"> Enabled everywhere</label>
  <label><input type="checkbox" id="autoOpen"> Auto-open panel on product pages</label>
  <div class="row">
    <span id="host" class="muted">…</span>
    <button id="toggleHost">…</button>
  </div>
  <p class="muted">Live prices are best-effort (Amazon/eBay may block automated lookups) —
     search links always work. Everything runs locally.</p>
  <script src="popup.js"></script>
</body>
</html>
